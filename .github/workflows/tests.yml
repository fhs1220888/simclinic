name: portable-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install diagnostic package
        run: python -m pip install .
      - name: Portable software tests (archive skips reported separately)
        run: python -m unittest discover -s tests -v
      - name: Synthetic diagnostic demo
        run: python -m simclinic demo --out demo-output/ci-demo
      - name: Public synthetic benchmark
        run: python -m simclinic benchmark benchmarks/synthetic-v1/manifest.json --root . --out demo-output/ci-benchmark
